name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaX-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 1

      - name: Send APK to Telegram
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          SIZE=$(du -sh "$APK" | cut -f1)
          curl -s -X POST "https://api.telegram.org/bot8647184674:AAGuPVx-IegaOf4IQeoTEd4uQ_k-Y26i9Tg/sendDocument" \
            -F chat_id="1481758747" \
            -F document=@"$APK" \
            -F caption="✅ *Build Berhasil!*\n📦 Size: ${SIZE}\n🔨 NovaX APK" \
            -F parse_mode="Markdown"

      - name: Notify if failed
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot8647184674:AAGuPVx-IegaOf4IQeoTEd4uQ_k-Y26i9Tg/sendMessage" \
            -d chat_id="1481758747" \
            -d parse_mode="Markdown" \
            -d text="❌ *Build GAGAL!*\nCek: https://github.com/Novaxcaja/NovaX/actions"
